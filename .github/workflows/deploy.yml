name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.1'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --dart-define=APP_ENV=prod --base-href /SegurAppRSAS/flutter/

      # La app principal ahora es la versión React (raíz del sitio); esta queda de respaldo en /flutter/.
      - name: Deploy to SegurAppRSAS/flutter
        run: |
          git clone https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/laruedevelopment/SegurAppRSAS.git deploy_repo
          mkdir -p deploy_repo/flutter
          find deploy_repo/flutter -mindepth 1 -delete
          cp -r build/web/. deploy_repo/flutter/
          cd deploy_repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Deploy: ${{ github.sha }}"
          git push
